name: fetch-assets
on:
  push:
    paths: ["fetch/urls.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p assets
          while IFS=' ' read -r name url; do
            [ -z "$name" ] && continue
            echo "GET $name"
            curl -sfL --retry 3 -o "assets/$name" "$url" || echo "FAIL $name"
          done < fetch/urls.txt
          ls -la assets
      - name: commit
        run: |
          git config user.name "fetch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets
          git commit -m "assets: fetch $(date -u +%Y%m%dT%H%M%SZ)" || echo "nothing to commit"
          git push
